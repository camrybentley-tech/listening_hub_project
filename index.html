    <script>
      // Safeguard against third-party Node SDKs (e.g. node-fetch/formdata-polyfill) 
      // attempting to overwrite the native browser fetch and crashing the app.
      if (typeof window !== 'undefined' && window.fetch) {
        const originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get: function() { return originalFetch; },
          set: function() { console.warn('Blocked attempt to overwrite window.fetch'); },
          configurable: true
        });
      }
    </script>
